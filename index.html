    <link rel="stylesheet" href="site.css">
    <style>
        :root {
            --page: #ffffff;
            --surface: #ffffff;
            --ink: #202124;
            --muted: #5f6368;
            --accent: #2b6da4;
            --accent-strong: #1d5b8d;
            --accent-soft: #edf5fb;
            --panel: #ffffff;
            --line: #d9e1e8;
            --serif: Georgia, "Times New Roman", serif;
        }

        .site-shell { width: min(1180px, calc(100% - 40px)); }
        .profile-layout { grid-template-columns: 250px minmax(0, 1fr); gap: 66px; }
        .portrait { width: 190px; border: 0; border-radius: 7px; box-shadow: none; }
        .profile-name { font-family: var(--sans); font-size: 1.75rem; }
        .profile-panels { grid-template-columns: 1fr; gap: 0; }
        .profile-panel { padding: 15px 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
        .page-title { font-family: var(--sans); font-size: clamp(1.8rem, 4vw, 2.25rem); font-weight: 720; letter-spacing: -0.02em; }
        .page-title::after { display: none; }
        .subheading { font-family: var(--sans); font-size: 1.25rem; }
        .quick-card,
        .research-card,
        .publication-card,
        .award-card,
        .contact-card {
            padding: 17px 0;
            border: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            background: transparent;
        }
        .quick-card:first-child,
        .research-card.featured { border-left: 0; }
        .quick-grid { gap: 28px; }
        .publication-card h3,
        .research-card h3 { font-size: 1.1rem; }

        @media (max-width: 980px) {
            .profile-layout { grid-template-columns: 230px minmax(0, 1fr); gap: 42px; }
        }

        @media (max-width: 740px) {
            .profile-panels { grid-template-columns: 1fr; }
        }
    </style>
</head>
